name: Conflict watch

# A pull request that conflicts with its base gets *no* checks at all. GitHub
# runs `pull_request` workflows against a merge commit it cannot create while
# the branch conflicts, so it never creates the check runs — and a PR with no
# checks looks exactly like one whose CI has not started yet. Nothing
# distinguishes "blocked" from "still queued", so the PR sits unnoticed.
#
# This job is the missing signal. It deliberately does not trigger on
# `pull_request`, because that is precisely the trigger that does not fire for
# a conflicted PR. Instead it sweeps when `main` moves — which is when
# conflicts appear — with a daily pass as a backstop.

on:
  push:
    branches: [main]
  schedule:
    # Early enough to be waiting when someone starts the day.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Labelling a pull request goes through the issues API.
  issues: write
  pull-requests: write

# One sweep at a time. A queued run is not cancelled: each sweep re-checks
# every open PR, so the later run subsumes the earlier one either way.
concurrency:
  group: conflict-watch
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'has-conflicts';
            const { owner, repo } = context.repo;

            // GitHub computes mergeability lazily: the first read of a pull
            // request returns `mergeable: null` and only *starts* the
            // background check. Treating that null as an answer would report
            // every PR as fine, so poll until it settles.
            async function mergeableState(number) {
              for (let attempt = 0; attempt < 6; attempt++) {
                const { data } = await github.rest.pulls.get({
                  owner, repo, pull_number: number,
                });
                if (data.mergeable !== null) return data.mergeable;
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
              return null;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'b60205',
                description: 'Conflicts with the base branch, so CI cannot run',
              });
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            let flagged = 0;
            for (const pull of pulls) {
              const wasFlagged = pull.labels.some(label => label.name === LABEL);
              const mergeable = await mergeableState(pull.number);

              // Note that `mergeable_state: 'blocked'` is *not* a conflict —
              // it means required checks are still pending — so the decision
              // keys off `mergeable` alone.
              if (mergeable === null) {
                core.warning(`#${pull.number}: mergeability unknown, leaving it alone`);
                continue;
              }

              if (mergeable === false && !wasFlagged) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pull.number, labels: [LABEL],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull.number,
                  body: [
                    `**This PR conflicts with \`${pull.base.ref}\`, so CI cannot run on it.**`,
                    '',
                    'GitHub builds `pull_request` checks against a merge commit it cannot',
                    'create while the branch conflicts, so no checks are reported at all —',
                    'which looks the same as CI not having started.',
                    '',
                    `Merge or rebase \`${pull.base.ref}\` in and push; the checks appear on the`,
                    'next push, and this label clears itself.',
                  ].join('\n'),
                });
                core.notice(`#${pull.number} conflicts with ${pull.base.ref}`);
                flagged++;
              } else if (mergeable === true && wasFlagged) {
                // No comment on the way out: the label going away is the whole
                // message, and the PR already carries the one that explains it.
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pull.number, name: LABEL,
                });
                core.notice(`#${pull.number} no longer conflicts`);
              } else if (mergeable === false) {
                flagged++;
              }
            }

            core.summary.addRaw(
              `Swept ${pulls.length} open PR(s); ${flagged} conflicting.`
            );
            await core.summary.write();
