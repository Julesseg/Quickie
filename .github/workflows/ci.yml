name: CI

# Skip CI when a change only touches docs. The run is skipped only if EVERY
# changed file matches one of these patterns — a mixed PR still runs in full.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'ROADMAP.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'ROADMAP.md'
      - 'AGENTS.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core · swift test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Run QuickieCore tests
        working-directory: Core
        run: swift test

  # Generated brand assets (icon/mark SVGs) must match their generators, and the
  # two hand-copies of the icon's palette — QuickieBrand.swift's Color literals
  # and the AccentColor asset's JSON — must match the constants they were copied
  # from (ADR 0033). Drift is silent otherwise (a malformed symbol even renders
  # as an EMPTY Control Center glyph). Caveat: a docs/**-only push skips CI
  # entirely (paths-ignore above), so a generator-only edit that forgot to
  # regenerate is caught on the next full run rather than its own.
  brand-assets:
    name: Brand · generated assets in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and compare brand assets
        run: python3 docs/brand/check-brand-assets.py

  # The Settings build stamp is only worth anything if it is always current, and
  # every condition that keeps it current lives in project.pbxproj — where an
  # unrelated Xcode edit can drop or reorder the stamping phase without breaking
  # the build. The failure is invisible: the app still ships a stamp, it is just
  # the wrong commit. This asserts the wiring instead of trusting it.
  build-stamp:
    name: App · build stamp wiring
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the stamp phase is wired into the app target
        run: python3 App/Scripts/check-build-stamp.py

  # Partition the XCUITest suite into shards so the (slow) UI suite can run
  # across several macOS runners in parallel. One sim-per-runner sidesteps the
  # contention that made same-runner `-parallel-testing-enabled` *slower* and
  # crash SwiftUI under CPU starvation on the ~3-core/7 GB hosted boxes.
  #
  # The split is per *test method*, not per class. Class-granularity capped the
  # run's wall clock at the slowest single class no matter how many shards were
  # thrown at it — CustomActionUITests alone is 11m30s of the suite's 48 min,
  # so every shard count from 5 up landed on the same 15m30s floor. Method
  # filters drop that floor to the slowest single test (~2 min).
  # See docs/adr/0038-shard-xcuitest-per-test-method.md.
  #
  # The split is computed from source, not hand-maintained: every UI suite is a
  # `class <Name>UITests: XCTestCase` in its own file, so a newly added suite is
  # always assigned to a shard automatically — it can never silently run in none.
  # The plan FAILS if a test class breaks that convention (wrong name suffix,
  # two classes in one file): the Xcode target syncs every file in the folder
  # into the bundle, and each shard runs `-only-testing:` filters, so a suite
  # this planner can't address would otherwise run in NO shard, silently.
  # See docs/adr/0026-shard-xcuitest-across-runners.md for the full rationale.
  ui-test-plan:
    name: Plan UI test shards
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Partition test methods into shards
        run: |
          set -euo pipefail
          # SHARD_COUNT is the one knob trading runners for wall clock. 5 is the
          # ceiling, not a preference: GitHub caps this account at 5 concurrent
          # *macOS* jobs, so a 6th shard doesn't run alongside the others — it
          # waits for a slot and lands a whole shard-length after them, which is
          # strictly worse than packing the same tests into 5. Runner minutes are
          # free on this public repo, so wall clock is the only currency.
          SHARD_COUNT=5
          # Deal individual test *methods* round-robin, in source order. Two
          # reasons not to bin-pack classes:
          #   * A class is indivisible, so the heaviest one is a floor on the
          #     whole run — CustomActionUITests is 11m30s of the suite's 48 min,
          #     which pins every shard count from 5 up at 15m30s. Methods have no
          #     such floor beyond the slowest single test.
          #   * Nothing here can weigh a *method* usefully. Measured durations
          #     span 10s–123s and correlate only weakly (r≈0.35) with anything
          #     visible in source, so a "smart" weight would be false precision.
          #     Round-robin over source order spreads each class's methods across
          #     every shard, which is what actually evens the load out.
          # Reading from source means a newly added test is always assigned.
          python3 - "$SHARD_COUNT" <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, re, sys
          n = int(sys.argv[1])
          tests, problems = [], []
          # Recursive: the Xcode target is a filesystem-synchronized group, so a
          # file in a subdirectory is in the test bundle and must be planned too.
          for path in sorted(glob.glob("App/QuickieUITests/**/*.swift", recursive=True)):
              src = open(path).read()
              # A suite is any class named *UITests, or any direct subclass of
              # XCTestCase / an intermediate *TestCase base — cast wide so an
              # unconventionally named test class is caught, not skipped.
              decls = re.findall(r'class\s+([A-Za-z0-9_]+)\s*:\s*([A-Za-z0-9_]+)', src)
              suites = [name for name, sup in decls
                        if name.endswith("UITests") or sup == "XCTestCase" or sup.endswith("TestCase")]
              if not suites:
                  continue  # helper file — nothing runnable to assign
              if len(suites) > 1:
                  problems.append(f"{path}: multiple test classes ({', '.join(suites)}) — keep one per file so the planner can address each test")
                  continue
              cls = suites[0]
              if not cls.endswith("UITests"):
                  problems.append(f"{path}: test class {cls} must be named <Name>UITests for the shard planner to address it")
                  continue
              # Source order, so the round-robin below interleaves each class's
              # methods across shards rather than clumping them on one.
              tests += [f"{cls}/{m}" for m in re.findall(r'func\s+(test[A-Za-z0-9_]*)\s*\(', src)]
          if problems:
              for p in problems:
                  sys.stderr.write(f"ERROR: {p}\n")
              sys.stderr.write("A suite the planner can't address would run in NO shard (every shard is -only-testing filtered). Fix the convention violation above.\n")
              sys.exit(1)
          if not tests:
              sys.stderr.write("No XCUITest methods found under App/QuickieUITests.\n")
              sys.exit(1)
          buckets = [tests[i::n] for i in range(n)]
          include = []
          for idx, b in enumerate(buckets, start=1):
              if not b:
                  continue
              only = " ".join(f"-only-testing:QuickieUITests/{t}" for t in b)
              include.append({"shard": str(idx), "of": str(n), "only": only, "tests": str(len(b))})
          sys.stderr.write(f"{len(tests)} test methods across {len(include)} shards\n")
          for e in include:
              sys.stderr.write(f"shard {e['shard']}/{e['of']}: {e['tests']} tests — {e['only']}\n")
          print("matrix=" + json.dumps({"include": include}))
          PY

  app-ui-tests:
    name: App · XCUITest (macOS) [shard ${{ matrix.shard }}/${{ matrix.of }}]
    needs: ui-test-plan
    runs-on: macos-15
    strategy:
      # Don't cancel the other shards when one fails — a red shard shouldn't hide
      # whether the rest are green, and it keeps each shard's crash log available.
      fail-fast: false
      matrix: ${{ fromJSON(needs.ui-test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: xcodebuild -version

      # Resolve a concrete device *id* rather than a name, then start booting it
      # before the build runs. A cold simulator boot is dead time on the critical
      # path — typically ~90s, and once measured at 8.7 min — that xcodebuild
      # otherwise pays *after* compiling. Kicking it off here overlaps it with
      # the ~2 min build instead. Booting needs the exact device the test run
      # will use, hence `id=` on the destination below: with `name=…,OS=latest`
      # xcodebuild is free to pick a same-named device on another runtime and
      # boot that one from cold anyway, wasting the head start.
      - name: Resolve an iPhone simulator and start booting it
        id: sim
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, re, subprocess, sys
          out = subprocess.run(["xcrun", "simctl", "list", "devices", "available", "--json"],
                               capture_output=True, text=True, check=True).stdout
          runtimes = json.loads(out)["devices"]
          def version(rt):
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (-1, -1)
          ios = [rt for rt in runtimes if "iOS" in rt and runtimes[rt]]
          if not ios:
              sys.exit("No available iOS simulator runtime on this runner.")
          newest = max(ios, key=version)
          phones = [d for d in runtimes[newest] if d["name"].startswith("iPhone")]
          if not phones:
              sys.exit(f"No available iPhone simulator in runtime {newest}.")
          # Same selection as the name-based resolver this replaced — last by
          # name — so the device the suite is proven against doesn't move.
          dev = sorted(phones, key=lambda d: d["name"])[-1]
          sys.stderr.write(f"Using simulator: {dev['name']} on {newest} ({dev['udid']})\n")
          print(dev["udid"])
          PY
          )
          # Non-fatal: returns as soon as the boot *starts*, so the sim warms up
          # while the build runs. If it fails, xcodebuild boots the device itself
          # and we only lose the head start.
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run UI tests
        working-directory: App
        run: |
          set -o pipefail
          # `-retry-tests-on-failure -test-iterations 3` reruns only the tests that
          # fail, up to three attempts each, and the run passes if a retry passes.
          # This absorbs the simulator's transient launch/lifecycle flakes (e.g.
          # "Failed to get background assertion for target app", which strikes at
          # `app.launch()` on a fresh sim) without masking real regressions — a
          # genuinely broken test fails all three attempts and still reports failure.
          #
          # This shard runs only its assigned test methods (`-only-testing:` from
          # the plan job) on a single simulator — no `-parallel-testing-enabled`,
          # since the parallelism here is across runners, not within one starved box.
          xcodebuild test \
            -project Quickie.xcodeproj \
            -scheme Quickie \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "TestResults-shard-${{ matrix.shard }}.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 3 \
            ${{ matrix.only }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Dump app crash reports on failure
        if: failure()
        run: |
          # Surface the actual crash/hang cause in the job log: when XCUITest
          # reports "Lost connection to the application", the reason lives in a
          # simulator .ips crash report on the host — buried inside the xcresult
          # artifact otherwise. Print this run's Quickie reports (the exception
          # message and termination reason sit in the header) so the failure is
          # diagnosable straight from the log.
          set +e
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -90 2>/dev/null | while read -r f; do
            case "$(basename "$f")" in
              Quickie*|quickie*) ;;
              *) continue ;;
            esac
            echo "================ $f"
            head -c 20000 "$f"
            echo
          done
          true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-shard-${{ matrix.shard }}
          path: App/TestResults-shard-${{ matrix.shard }}.xcresult
          if-no-files-found: ignore

  # Single stable check that branch protection can require, regardless of how
  # many shards exist or how they're named. This carries the exact name the
  # serial job used to have ("App · XCUITest (macOS)"), so the required-check
  # configuration keeps working across shard-count changes — the check-name
  # churn is what bit the previous sharding attempt (see PR #88).
  app-ui-tests-gate:
    name: App · XCUITest (macOS)
    needs: [ui-test-plan, app-ui-tests]
    # Run even when a shard fails (a plain `needs` would skip this job, leaving
    # the required check pending instead of red). Still skip on cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every shard passed
        run: |
          echo "plan: ${{ needs.ui-test-plan.result }}, shards: ${{ needs.app-ui-tests.result }}"
          if [ "${{ needs.ui-test-plan.result }}" != "success" ] || [ "${{ needs.app-ui-tests.result }}" != "success" ]; then
            exit 1
          fi
