name: CI

# Skip CI when a change only touches docs. The run is skipped only if EVERY
# changed file matches one of these patterns — a mixed PR still runs in full.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'ROADMAP.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'ROADMAP.md'
      - 'AGENTS.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core · swift test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Run QuickieCore tests
        working-directory: Core
        run: swift test

  # Generated brand assets (icon/mark SVGs) must match their generators, and the
  # two hand-copies of the icon's palette — QuickieBrand.swift's Color literals
  # and the AccentColor asset's JSON — must match the constants they were copied
  # from (ADR 0033). Drift is silent otherwise (a malformed symbol even renders
  # as an EMPTY Control Center glyph). Caveat: a docs/**-only push skips CI
  # entirely (paths-ignore above), so a generator-only edit that forgot to
  # regenerate is caught on the next full run rather than its own.
  brand-assets:
    name: Brand · generated assets in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and compare brand assets
        run: python3 docs/brand/check-brand-assets.py

  # The Settings build stamp is only worth anything if it is always current, and
  # every condition that keeps it current lives in project.pbxproj — where an
  # unrelated Xcode edit can drop or reorder the stamping phase without breaking
  # the build. The failure is invisible: the app still ships a stamp, it is just
  # the wrong commit. This asserts the wiring instead of trusting it.
  build-stamp:
    name: App · build stamp wiring
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the stamp phase is wired into the app target
        run: python3 App/Scripts/check-build-stamp.py

  # Partition the XCUITest classes into shards so the (slow) UI suite can run
  # across several macOS runners in parallel. One sim-per-runner sidesteps the
  # contention that made same-runner `-parallel-testing-enabled` *slower* and
  # crash SwiftUI under CPU starvation on the ~3-core/7 GB hosted boxes.
  #
  # The split is computed from source, not hand-maintained: every UI suite is a
  # `class <Name>UITests: XCTestCase` in its own file, so a newly added suite is
  # always assigned to a shard automatically — it can never silently run in none.
  # The plan FAILS if a test class breaks that convention (wrong name suffix,
  # two classes in one file): the Xcode target syncs every file in the folder
  # into the bundle, and each shard runs `-only-testing:` filters, so a suite
  # this planner can't address would otherwise run in NO shard, silently.
  # See docs/adr/0026-shard-xcuitest-across-runners.md for the full rationale.
  #
  # Every shard is planned once per device family: Quickie ships universal
  # (TARGETED_DEVICE_FAMILY = "1,2") and the two families do not lay the app out
  # the same — an iPad is regular-width where an iPhone in portrait is compact,
  # so a sheet, a split view or a shelf that never fits on one can be the wrong
  # shape on the other. See docs/adr/0038-run-the-ui-suite-on-both-families.md.
  ui-test-plan:
    name: Plan UI test shards
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Partition test classes into shards
        run: |
          set -euo pipefail
          # SHARD_COUNT trades billed macOS minutes for wall-clock: each shard is a
          # separate runner doing its own build + its slice of the suite. It is per
          # *device family*, so the matrix is SHARD_COUNT × 2 runners.
          #
          # 2 — because only ~4 macOS jobs actually run at once here (the account's
          # cap, less the slot the Release workflow's build job takes on the same
          # PR). Past that, extra shards do not run in parallel: they queue into a
          # second wave and each still pays its own ~6 min build, so the gate gets
          # *slower* and more expensive at the same time. Raise this only alongside
          # a higher concurrent-macOS budget.
          SHARD_COUNT=2
          # Balance shards by *test-method* count, not class count: a class holds
          # anywhere from 1 to 8 `func test`s, so round-robining classes lands
          # most of the work on one runner and the wall clock barely moves. Instead
          # weigh each class by its test count and greedily pack the heaviest into
          # the currently-lightest shard (longest-processing-time bin packing).
          # Reading from source means a newly added suite is always assigned.
          python3 - "$SHARD_COUNT" <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, re, sys
          n = int(sys.argv[1])
          weights, problems = [], []
          # Recursive: the Xcode target is a filesystem-synchronized group, so a
          # file in a subdirectory is in the test bundle and must be planned too.
          for path in sorted(glob.glob("App/QuickieUITests/**/*.swift", recursive=True)):
              src = open(path).read()
              # A suite is any class named *UITests, or any direct subclass of
              # XCTestCase / an intermediate *TestCase base — cast wide so an
              # unconventionally named test class is caught, not skipped.
              decls = re.findall(r'class\s+([A-Za-z0-9_]+)\s*:\s*([A-Za-z0-9_]+)', src)
              suites = [name for name, sup in decls
                        if name.endswith("UITests") or sup == "XCTestCase" or sup.endswith("TestCase")]
              if not suites:
                  continue  # helper file — nothing runnable to assign
              if len(suites) > 1:
                  problems.append(f"{path}: multiple test classes ({', '.join(suites)}) — keep one per file so shard weights stay attributable")
                  continue
              cls = suites[0]
              if not cls.endswith("UITests"):
                  problems.append(f"{path}: test class {cls} must be named <Name>UITests for the shard planner to address it")
                  continue
              # `or 1` so a class with no test methods still occupies a slot.
              weights.append((len(re.findall(r'func\s+test', src)) or 1, cls))
          if problems:
              for p in problems:
                  sys.stderr.write(f"ERROR: {p}\n")
              sys.stderr.write("A suite the planner can't address would run in NO shard (every shard is -only-testing filtered). Fix the convention violation above.\n")
              sys.exit(1)
          if not weights:
              sys.stderr.write("No XCUITest classes found under App/QuickieUITests.\n")
              sys.exit(1)
          weights.sort(reverse=True)
          buckets = [{"tests": 0, "classes": []} for _ in range(n)]
          for count, cls in weights:
              b = min(buckets, key=lambda x: x["tests"])
              b["tests"] += count
              b["classes"].append(cls)
          # The same split, run once per device family. `device` is both the
          # check's name and the prefix its simulator is resolved by — every
          # simulator in a family is named after it.
          devices = ["iPhone", "iPad"]
          include = []
          for device in devices:
              for idx, b in enumerate(buckets, start=1):
                  if not b["classes"]:
                      continue
                  only = " ".join(f"-only-testing:QuickieUITests/{c}" for c in b["classes"])
                  include.append({"device": device, "shard": str(idx), "of": str(n), "only": only, "tests": str(b["tests"])})
          for e in include:
              sys.stderr.write(f"{e['device']} shard {e['shard']}/{e['of']}: {e['tests']} tests — {e['only']}\n")
          print("matrix=" + json.dumps({"include": include}))
          PY

  app-ui-tests:
    name: App · XCUITest (${{ matrix.device }}) [shard ${{ matrix.shard }}/${{ matrix.of }}]
    needs: ui-test-plan
    runs-on: macos-15
    strategy:
      # Don't cancel the other shards when one fails — a red shard shouldn't hide
      # whether the rest are green, and it keeps each shard's crash log available.
      # That covers the families too: an iPad-only regression still reports every
      # iPhone shard rather than cancelling it.
      fail-fast: false
      matrix: ${{ fromJSON(needs.ui-test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: xcodebuild -version

      - name: Resolve an available ${{ matrix.device }} simulator
        id: sim
        env:
          DEVICE_PREFIX: ${{ matrix.device }}
        run: |
          set -euo pipefail
          # Last by name within the family, which is how the iPhone leg has
          # always landed on an iPhone SE (and the iPad leg lands on an iPad
          # mini): the tightest layout the family has, where a row below the
          # fold or a clipped sheet shows up first. Fail loudly rather than
          # falling back to a hardcoded name — a leg that silently ran the
          # other family's simulator would be a green check for nothing.
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, os, sys
          prefix = os.environ['DEVICE_PREFIX']
          d = json.load(sys.stdin)['devices']
          names = [x['name'] for rt in d for x in d[rt] if x['name'].startswith(prefix)]
          if not names:
              sys.exit(f'::error::no {prefix} simulator is available on this runner')
          print(sorted(names)[-1])
          ")
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build & run UI tests
        working-directory: App
        run: |
          set -o pipefail
          # `-retry-tests-on-failure -test-iterations 3` reruns only the tests that
          # fail, up to three attempts each, and the run passes if a retry passes.
          # This absorbs the simulator's transient launch/lifecycle flakes (e.g.
          # "Failed to get background assertion for target app", which strikes at
          # `app.launch()` on a fresh sim) without masking real regressions — a
          # genuinely broken test fails all three attempts and still reports failure.
          #
          # This shard runs only its assigned classes (`-only-testing:` from the
          # plan job) on a single simulator — no `-parallel-testing-enabled`, since
          # the parallelism here is across runners, not within one starved box.
          xcodebuild test \
            -project Quickie.xcodeproj \
            -scheme Quickie \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            -resultBundlePath "TestResults-${{ matrix.device }}-shard-${{ matrix.shard }}.xcresult" \
            -retry-tests-on-failure \
            -test-iterations 3 \
            ${{ matrix.only }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Dump app crash reports on failure
        if: failure()
        run: |
          # Surface the actual crash/hang cause in the job log: when XCUITest
          # reports "Lost connection to the application", the reason lives in a
          # simulator .ips crash report on the host — buried inside the xcresult
          # artifact otherwise. Print this run's Quickie reports (the exception
          # message and termination reason sit in the header) so the failure is
          # diagnosable straight from the log.
          set +e
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -mmin -90 2>/dev/null | while read -r f; do
            case "$(basename "$f")" in
              Quickie*|quickie*) ;;
              *) continue ;;
            esac
            echo "================ $f"
            head -c 20000 "$f"
            echo
          done
          true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # Per family as well as per shard — upload-artifact@v4 rejects a name a
          # sibling job in the same run already claimed.
          name: ui-test-results-${{ matrix.device }}-shard-${{ matrix.shard }}
          path: App/TestResults-${{ matrix.device }}-shard-${{ matrix.shard }}.xcresult
          if-no-files-found: ignore

  # Single stable check that branch protection can require, regardless of how
  # many shards exist or how they're named. This carries the exact name the
  # serial job used to have ("App · XCUITest (macOS)"), so the required-check
  # configuration keeps working across shard-count changes — and across the
  # device families, which are shards of the same matrix. The check-name churn
  # is what bit the previous sharding attempt (see PR #88).
  app-ui-tests-gate:
    name: App · XCUITest (macOS)
    needs: [ui-test-plan, app-ui-tests]
    # Run even when a shard fails (a plain `needs` would skip this job, leaving
    # the required check pending instead of red). Still skip on cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every shard passed
        run: |
          echo "plan: ${{ needs.ui-test-plan.result }}, shards: ${{ needs.app-ui-tests.result }}"
          if [ "${{ needs.ui-test-plan.result }}" != "success" ] || [ "${{ needs.app-ui-tests.result }}" != "success" ]; then
            exit 1
          fi
